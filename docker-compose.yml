# report-portal on Synology NAS — standalone aggregator, its OWN compose project
# (project name: report-portal), deliberately separate from kg-hub.
#
# Networking: it joins kg-hub's existing docker network (kg-hub_default, declared
# below as external) ONLY so it can reach the kg-hub server by service name for
# server-side manifest fetches (http://kg_hub_server:8080). The portal itself is
# published on host loopback 17172; tailscale userspace forwarding exposes
# <tailscale-ip>:17172 to the tailnet (same pattern as kg-hub's 17171).
#
# Layout on NAS:
#   /volume1/docker/report-portal-src/   <- this folder (Project folder = build context)

services:
  report_portal:
    build:
      context: .
      dockerfile: Dockerfile
    # 标签由 deploy/release.sh 按 git commit 写进同目录 .env。用 `:?` 而不是给
    # 默认值：宁可让 compose 当场失败，也不要在没人指定版本时悄悄跑成 latest——
    # 那样线上跑的是哪个 commit 就再也说不清了（准则 1/26）。
    image: report-portal:${PORTAL_IMAGE_TAG:?必须由 deploy/release.sh 按 git commit 设定；不接受 latest}
    container_name: report-portal
    # Synology 默认的 db 日志驱动每行一次 SQLite 提交，NAS btrfs 上每行约 0.6–0.9MB 写入（T-0245）。
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    environment:
      - PORTAL_BIND_HOST=0.0.0.0
      - PORTAL_BIND_PORT=8080
      # Server-side fetch over the shared docker network; browser links over tailnet.
      - KGHUB_FETCH_BASE=http://kg_hub_server:8080
      - KGHUB_LINK_BASE=http://100.123.208.32:17171
      # To add more sources, set PORTAL_SOURCES to a JSON array (overrides default):
      # - PORTAL_SOURCES=[{"id":"kg-hub","name":"kg-hub 知识胶囊","fetch_base":"http://kg_hub_server:8080","link_base":"http://100.123.208.32:17171","manifest":"/portal_manifest"}]
    ports:
      # Host loopback only (off 17171); tailscale forwards <tailscale-ip>:17172 -> here.
      - "127.0.0.1:17172:8080"
    networks:
      - kghub

  # NAS 存储与写盘监控（nas_monitor.py）：门户的一个数据源，看板 /dashboard/nas。
  # 同一个镜像、不同的入口；随 deploy/release.sh 一起发布和回滚。
  nas_monitor:
    image: report-portal:${PORTAL_IMAGE_TAG:?必须由 deploy/release.sh 按 git commit 设定；不接受 latest}
    container_name: nas-monitor
    # Synology 默认的 db 日志驱动每行一次 SQLite 提交，NAS btrfs 上每行约 0.6–0.9MB 写入（T-0245）。
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    command: ["python", "nas_monitor.py"]
    # 1027:100 = commiao:users（多个项目数据目录是 commiao 0700）。附加组：
    #   0     读 /var/run/docker.sock（root:root 0660）——代码里只发 GET，见 DockerReader；
    #   10001 统计 zhaopin data/backups（10002:10001 0770）的大小，不读内容。
    user: "1027:100"
    group_add: ["0", "10001"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      - TZ=Asia/Shanghai
      - NAS_MONITOR_DB=/data/nas-monitor.sqlite3
      - NAS_MONITOR_FEISHU_FILE=/secrets/feishu-webhook.json
      - NAS_MONITOR_LINK=http://100.123.208.32:17174
    volumes:
      # /proc/diskstats 不分命名空间，容器里读到的就是整机计数，无需挂载。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /volume2/4T/nas-monitor/data:/data
      # 飞书 webhook（{"url": ..., "secret"?: ...}，0600，不进 git）；文件不存在时只在看板标红、不发通知。
      - /volume2/4T/nas-monitor/secrets:/secrets:ro
      # 只读挂载各项目要统计的目录（与 monitor/projects.json 对应，测试会核对）。
      - /volume2/4T/kg-hub-data:/host/kg-hub-data:ro
      - /volume2/4T/model-gateway:/host/model-gateway:ro
      - /volume1/docker/recruitment-intel-service/release-staging:/host/zhaopin/release-staging:ro
      - /volume1/docker/recruitment-intel-service/data/backups:/host/zhaopin/backups:ro
    ports:
      # 和门户一样只绑本机回环；tailscale 把 <tailscale-ip>:17174 转发过来。
      - "127.0.0.1:17174:8080"
    networks:
      - kghub

networks:
  # Reuse kg-hub's existing network so service-name DNS (kg_hub_server) resolves.
  kghub:
    external: true
    name: kg-hub_default
